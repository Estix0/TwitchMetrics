version: '3.8'

services:
  tracker_channel1:
    build: .
    container_name: tracker_channel1
    restart: unless-stopped
    environment:
      - TZ=Europe/Warsaw
      - PANEL_TIMEZONE=Europe/Warsaw
    env_file:
      - .env.channel1
    ports:
      - "8501:8501"
      - "8000:8000"
    volumes:
      - ./data/channel1:/data
      - ./:/app
